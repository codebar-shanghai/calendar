name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/CI.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "events.schema.json"
      - "tsconfig.json"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint
