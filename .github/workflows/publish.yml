name: Build and publish calendar

on:
  pull_request:
    paths:
      - "data/events.yml"
  push:
    branches:
      - main
    paths:
      - "data/events.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Generate ICS files
        run: node dist/index.js gen data/events.yml -d out

      - name: Upload generated output (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: out
          path: out

      - name: Configure Pages (push only)
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (push only)
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
